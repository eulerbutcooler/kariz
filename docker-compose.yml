services:
  surang:
    image: ghcr.io/eulerbutcooler/surang-server:latest
    restart: unless-stopped
    ports:
      - "443:443"     # visitors: tunnels and api.<domain>, TLS
      - "80:80"       # redirects to https
      - "5555:5555"   # clients: control plane, TLS
      - "127.0.0.1:9000:9000"   # API, TLS
    volumes:
      - surang-data:/data
    command: -domain surang.xyz -tls-domain surang.xyz -tls-email you@example.com -db /data/surang.db
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}

volumes:
  surang-data:
