name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Build all platforms
        run: |
          VERSION=${GITHUB_REF_NAME}
          DIST="dist/${VERSION}"
          mkdir -p "$DIST"
          build() {
            bin=$1; os=$2; arch=$3; ext=""
            [ "$os" = "windows" ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "$DIST/${bin}-${os}-${arch}${ext}" "./cmd/$bin"
          }
          for arch in amd64 arm64; do build surang-server linux $arch; done
          for os in linux darwin; do for arch in amd64 arm64; do
            build surang-client $os $arch
          done; done
          build surang-client windows amd64
          (cd "$DIST" && sha256sum * > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ github.ref_name }}/*

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/eulerbutcooler/surang-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
